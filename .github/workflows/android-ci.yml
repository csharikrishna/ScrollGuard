name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew's executable bit is now tracked correctly in git, but this is cheap insurance
      # against it ever regressing (e.g. a future commit made from a filesystem that doesn't
      # preserve the mode bit) silently breaking every job below with "Permission denied".
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret configured. The google-services Gradle" \
                 "plugin requires app/google-services.json to exist (it's not committed — see" \
                 "app/google-services.json.sample) and every step below needs it, including" \
                 "unit tests (includeAndroidResources=true triggers the same resource" \
                 "processing). Add the secret: base64 your Firebase project's" \
                 "google-services.json and store it as GOOGLE_SERVICES_JSON_BASE64 in" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint (debug)
        run: ./gradlew lintDebug --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: Assemble release (unsigned unless secrets are configured)
        run: ./gradlew assembleRelease --console=plain
        env:
          SCROLLGUARD_RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          SCROLLGUARD_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SCROLLGUARD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SCROLLGUARD_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Signed release build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Write google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret configured — cannot build without it."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Decode release keystore
        run: |
          # All four secrets are required together. A job whose entire purpose is producing a
          # SIGNED release must fail loudly on a partial configuration rather than silently
          # falling through to app/build.gradle's local-dev unsigned fallback and still
          # reporting success (the fallback exists for developer machines with no production
          # credentials at all — not for a tagged release-signing job with some secrets missing).
          missing=""
          [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required release signing secret(s):$missing"
            echo "Refusing to produce an unsigned artifact from a tagged release build."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release
        run: ./gradlew assembleRelease bundleRelease --console=plain
        env:
          SCROLLGUARD_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          SCROLLGUARD_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SCROLLGUARD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SCROLLGUARD_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          # error (not the default warn) so a signing regression that produces
          # app-release-unsigned.apk instead of app-release.apk fails the job loudly instead
          # of uploading nothing and still reporting success.
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
