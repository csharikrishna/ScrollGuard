android.useAndroidX=true
# Jetifier rewrites legacy android.support.* references to AndroidX. This project has no
# non-AndroidX dependencies left to rewrite, and leaving it on breaks unit tests: it tries to
# process every jar on the classpath (including test-only transitive deps like Robolectric's
# bouncycastle) and fails on ones built with a newer bytecode version than it understands.
android.enableJetifier=false
kotlin.code.style=official
